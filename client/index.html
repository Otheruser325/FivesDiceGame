<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fives</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <!-- Pin CDN bytes so a changed dependency cannot execute unnoticed. -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" integrity="sha384-AvQiDMZAVLda3VtAoU5MCfBz8pzXhteb2CiUJeKBmPlWzpXj1uJ96Km11+YuFNu/" crossorigin="anonymous"></script>
    <!-- Socket.IO fallbacks must pass the same integrity check. -->
    <script>
      // Determine server URL and load socket.io from there
      (function() {
        const paths = [
          'https://cdn.socket.io/4.8.1/socket.io.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js'
        ];
        const integrity = 'sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+';
        
        let loaded = false;
        const loadSocketIO = (index) => {
          if (index >= paths.length) {
            if (!loaded) {
              console.error('[SocketIO] Failed to load socket.io from any path');
              // Fallback: create a stub
              window.io = null;
            }
            return;
          }
          
          const script = document.createElement('script');
          const path = paths[index];
          script.src = path;
          script.integrity = integrity;
          script.crossOrigin = 'anonymous';
          
          script.onload = () => {
            loaded = true;
            console.info('[SocketIO] Loaded from:', path);
          };
          
          script.onerror = () => {
            console.debug('[SocketIO] Failed to load from:', path, '- trying next');
            loadSocketIO(index + 1);
          };
          
          script.type = 'text/javascript';
          script.async = true;
          document.head.appendChild(script);
        };
        
        loadSocketIO(0);
      })();
    </script>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container"></div>

    <!-- Game Code -->
    <script type="module" src="main.js"></script>

</body>
</html>
